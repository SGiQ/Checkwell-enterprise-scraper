slug: pace_programs_se
display_name: PACE Programs — Southeast US
mode: directory
description: |
  PACE (Programs of All-Inclusive Care for the Elderly) centers across
  FL/GA/SC/NC/TN. PACE is a federal Medicare/Medicaid program serving
  participants 55+ who would otherwise need nursing-home level care.
  Small universe (~300 programs nationally, maybe 25-30 in the SE) but
  every one of them fields calls from families whose loved ones DON'T
  qualify (income too high, outside the service area, not nursing-home
  eligible yet) — those non-qualifying families are exactly the
  CheckWellCall customer. Pitch is partnership-toned, not vendor.

directory:
  category_label: pace_program
  search_queries:
    - PACE program
    - Program of All-Inclusive Care for the Elderly
    - PACE center
    - PACE senior care
  locations:
    - Miami, FL
    - Fort Lauderdale, FL
    - Tampa, FL
    - St. Petersburg, FL
    - Orlando, FL
    - Jacksonville, FL
    - Naples, FL
    - Sarasota, FL
    - Atlanta, GA
    - Savannah, GA
    - Augusta, GA
    - Charleston, SC
    - Columbia, SC
    - Greenville, SC
    - Charlotte, NC
    - Raleigh, NC
    - Greensboro, NC
    - Asheville, NC
    - Wilmington, NC
    - Durham, NC
    - Nashville, TN
    - Memphis, TN
    - Knoxville, TN
    - Chattanooga, TN
  min_rating: 3.5
  max_per_query: 20

default_outreach_template: referral_partnership

outreach_templates:
  - key: referral_partnership
    name: Cold Email — Non-Qualifying Family Referrals
    subject: "For the {city} families {business_name} can't enroll"
    body: |
      Hi {contact_name},

      {personalized_opener}

      You probably get several calls a month from {city} families who'd benefit from PACE but don't qualify — income above the bracket, not nursing-home-level need yet, or outside {business_name}'s service area. Today the answer to those families is usually "here are some resources" and then they're on their own.

      CheckWellCall is the daily wellness check call for that gap — seniors who live alone, need a touchpoint, but aren't ready for enrollment in a comprehensive program. We'd love to be on {business_name}'s short list when those calls come in.

      A few PACE programs in the SE offer us as an outbound referral to non-qualifying families. Worth a 15-minute call to see if a similar arrangement could work for {business_name}?

      Best,
      Shaun
      SGiQ Business Strategies | CheckWellCall
      1-877-343-1891 | checkwellcall.com
  - key: post_disenrollment
    name: Cold Email — Post-Disenrollment Support
    subject: "Step-down support for {business_name}'s disenrolling participants"
    body: |
      Hi {contact_name},

      {personalized_opener}

      When a participant leaves PACE — voluntarily, geographically, or because their needs changed — there's usually no formal step-down support. They go from comprehensive coordinated care to "you're on your own" overnight.

      CheckWellCall offers a soft landing: daily wellness check calls that catch the changes (missed meds, isolation, cognitive shifts) that often follow disenrollment. Family-facing reports go to the adult children; escalations come back to whoever's coordinating next-step care.

      Open to a brief conversation about whether this could fit {business_name}'s disenrollment workflow?

      Best,
      Shaun
      SGiQ Business Strategies | CheckWellCall
  - key: follow_up
    name: Cold Email — Follow-up
    subject: "Following up — referral partnership"
    body: |
      Hi {contact_name},

      Following up on the note about a referral partnership for {business_name}'s non-qualifying families. Happy to send a brief overview document if a call doesn't fit right now.

      Best,
      Shaun