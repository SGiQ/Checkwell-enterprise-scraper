slug: area_agencies_on_aging_se
display_name: Area Agencies on Aging — Southeast US
mode: directory
description: |
  Area Agencies on Aging (AAAs) across FL/GA/SC/NC/TN. Federally-mandated
  regional coordinators under the Older Americans Act — every state has
  them, ~600 nationally. They're the local front-door for senior services:
  they take "what do I do about my parent?" calls all day and refer to
  vetted providers (Meals on Wheels coordination, transportation,
  caregiver support, ombudsman, I&R, etc.).

  The pitch: pure referral-partner play. AAAs are the highest-volume
  source of inbound "we need help" inquiries in their region. Getting on
  an AAA's referral list is one of the most efficient SMB lead sources
  in eldercare.

  Note: AAAs are non-profits / government-adjacent. Google reviews are
  sparse, so min_rating is dropped. Decision-makers vary: Executive
  Director, Director of Community Services, Information & Referral
  Coordinator, Caregiver Support Program Manager.

directory:
  category_label: area_agency_on_aging
  search_queries:
    - Area Agency on Aging
    - AAA aging services
    - aging and disability resource center
    - council on aging
    - senior services agency
  locations:
    - Miami, FL
    - Fort Lauderdale, FL
    - Tampa, FL
    - St. Petersburg, FL
    - Orlando, FL
    - Jacksonville, FL
    - Tallahassee, FL
    - Naples, FL
    - Sarasota, FL
    - Atlanta, GA
    - Savannah, GA
    - Augusta, GA
    - Macon, GA
    - Charleston, SC
    - Columbia, SC
    - Greenville, SC
    - Charlotte, NC
    - Raleigh, NC
    - Greensboro, NC
    - Asheville, NC
    - Wilmington, NC
    - Nashville, TN
    - Memphis, TN
    - Knoxville, TN
    - Chattanooga, TN
  min_rating: 0.0       # AAAs are non-profits; sparse Google reviews
  max_per_query: 20

default_outreach_template: referral_listing

outreach_templates:
  - key: referral_listing
    name: Cold Email — Get on the Referral List
    subject: "Adding CheckWellCall to {business_name}'s referral resources"
    body: |
      Hi {contact_name},

      {business_name} probably fields dozens of inquiries each month from {city} families saying some version of "my mom is alone and we're worried." For the families whose situation is more monitoring-need than acute-need, CheckWellCall is the fit: affordable daily wellness check calls with documented escalation to family when something seems off.

      A few SE US AAAs include us on their I&R referral list as one option in the "monitoring & companionship" category. We'd be grateful for the chance to be vetted for {business_name}'s referral resources — happy to send compliance documentation, pricing, and references.

      Open to a brief introduction call?

      Best,
      Shaun
      SGiQ Business Strategies | CheckWellCall
      1-877-343-1891 | checkwellcall.com
  - key: caregiver_program
    name: Cold Email — Caregiver Support Program Partnership
    subject: "Wellness checks as a caregiver-support benefit for {business_name}"
    body: |
      Hi {contact_name},

      Title III-E Caregiver Support funds at most AAAs already cover respite, counseling, and education for family caregivers — but the actual reduction in caregiver stress comes from removing the day-to-day monitoring burden. A daily wellness check on the care recipient does more for caregiver wellbeing than a one-time respite week.

      Could CheckWellCall be a reimbursable service under {business_name}'s caregiver-support program? A few SE US AAAs are exploring this structure. Worth a 15-minute call to discuss?

      Best,
      Shaun
      SGiQ Business Strategies | CheckWellCall
  - key: follow_up
    name: Cold Email — Follow-up
    subject: "Following up — CheckWellCall as a referral resource"
    body: |
      Hi {contact_name},

      Circling back on the note about adding CheckWellCall to {business_name}'s referral list. Happy to send a one-pager (services, pricing, geographic coverage, compliance posture) if a call doesn't fit right now.

      Best,
      Shaun