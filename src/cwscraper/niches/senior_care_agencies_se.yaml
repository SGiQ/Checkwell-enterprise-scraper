slug: senior_care_agencies_se
display_name: Senior Care Agencies — Southeast US
mode: directory
description: |
  Discovers senior-care businesses across FL/GA/SC/NC/TN for B2B outreach:
  home-care agencies, assisted-living facilities, memory care, in-home senior
  care. Use this pack when you're selling TO agencies (wellness check
  partnerships, white-label services), not directly to caregiver consumers.

# ---------------------------------------------------------------------------
# Directory mode: where to look for businesses
# ---------------------------------------------------------------------------
directory:
  category_label: senior_care_agency

  # Each search_query gets concatenated with each location, so 4 queries x
  # 22 locations = 88 Google Places text-search requests per full scan.
  # At ~$0.035/request after the $200/mo free tier, that's ~$3 per full scan.
  search_queries:
    - home care agency
    - assisted living facility
    - in-home senior care
    - memory care

  locations:
    # Florida (largest senior-care market in the US)
    - Miami, FL
    - Fort Lauderdale, FL
    - Tampa, FL
    - St. Petersburg, FL
    - Orlando, FL
    - Jacksonville, FL
    - Naples, FL
    - Sarasota, FL
    # Georgia
    - Atlanta, GA
    - Savannah, GA
    - Augusta, GA
    # South Carolina
    - Charleston, SC
    - Columbia, SC
    - Greenville, SC
    # North Carolina
    - Charlotte, NC
    - Raleigh, NC
    - Greensboro, NC
    - Asheville, NC
    # Tennessee
    - Nashville, TN
    - Memphis, TN
    - Knoxville, TN
    - Chattanooga, TN

  min_rating: 3.5         # filter obvious low-quality leads
  max_per_query: 20       # API caps at 20 per text search anyway

# ---------------------------------------------------------------------------
# Outreach templates — cold email to agencies
# Placeholders: {business_name}, {city}, {state}, {contact_name}
# ---------------------------------------------------------------------------
default_outreach_template: cold_intro

outreach_templates:
  - key: cold_intro
    name: Cold Email — Partnership Intro
    subject: "Wellness checks for {business_name}'s {city} clients"
    body: |
      Hi {contact_name},

      I run CheckWellCall — a daily wellness check service for seniors aging
      in place. We do the human follow-up call most agencies don't have the
      bandwidth for: friendly check-ins, escalation to family or your team if
      something seems off, and a clean audit trail your families can see.

      A few {city} agencies we work with use us as:
        • a value-add for clients between scheduled visits
        • a way to catch deterioration earlier than the next scheduled care call
        • a low-risk pilot before expanding home-care frequency

      Would a 15-minute call this week or next make sense? Happy to share what
      pricing looks like and whether the fit is right for {business_name}.

      Best,
      Shaun
      SGiQ Business Strategies | CheckWellCall
      1-877-343-1891 | checkwellcall.com

  - key: follow_up
    name: Cold Email — Follow-up
    subject: "Quick follow-up — wellness checks for {business_name}"
    body: |
      Hi {contact_name},

      Following up on my note last week about wellness check support for
      {business_name}'s clients.

      No pressure either way — wanted to make sure it landed. If now's not
      the right time, I'd love to circle back in a quarter. If you'd like
      more info, the short overview is at checkwellcall.com.

      Best,
      Shaun

  - key: referral_partner
    name: Cold Email — Referral Partner Pitch
    subject: "Sending {city} caregiver referrals your way"
    body: |
      Hi {contact_name},

      We work with adult children across {city} who reach out looking for
      caregiving help for a parent. CheckWellCall does daily wellness check
      calls, but for in-home care we always refer to a small list of trusted
      local agencies.

      I'd like to learn whether {business_name} could be a good referral
      partner for our {city}, {state} clients. Open to a quick intro call?

      Best,
      Shaun
      SGiQ Business Strategies | CheckWellCall
