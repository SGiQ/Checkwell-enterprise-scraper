slug: churches_se
display_name: Churches & Faith Communities — Southeast US
mode: directory
description: |
  Churches across FL/GA/SC/NC/TN. Faith communities are gold-tier referral
  partners for senior services because they're trusted institutions with
  established member-care ministries that already track isolated, elderly,
  and homebound congregants. The decision-maker is usually a Director of
  Congregational Care, Pastor of Member Care, or Senior Pastor — not a
  traditional B2B buyer. Outreach should be partnership-toned, not vendor-y.

directory:
  category_label: church
  # Multiple denominational queries to broaden coverage; "church" alone is
  # too broad and surfaces a lot of non-active locations.
  search_queries:
    - church
    - presbyterian church
    - baptist church
    - methodist church
    - catholic church
    - non-denominational church
  locations:
    - Miami, FL
    - Fort Lauderdale, FL
    - Tampa, FL
    - St. Petersburg, FL
    - Orlando, FL
    - Jacksonville, FL
    - Naples, FL
    - Sarasota, FL
    - Atlanta, GA
    - Savannah, GA
    - Augusta, GA
    - Charleston, SC
    - Columbia, SC
    - Greenville, SC
    - Charlotte, NC
    - Raleigh, NC
    - Greensboro, NC
    - Asheville, NC
    - Nashville, TN
    - Memphis, TN
    - Knoxville, TN
    - Chattanooga, TN
  min_rating: 4.0     # higher bar — quality > quantity for faith outreach
  max_per_query: 20

default_outreach_template: cold_intro

outreach_templates:
  - key: cold_intro
    name: Cold Email — Congregational Care Partnership
    subject: "Daily wellness checks for {business_name}'s homebound members"
    body: |
      Hi {contact_name},

      {personalized_opener}

      Many congregations have a small group of older or homebound members who slip through the cracks between deacon visits, Sunday services, and the formal pastoral-care rotation. CheckWellCall does daily wellness check calls — a kind, scripted check-in — that flags any day someone doesn't pick up or sounds concerning, then escalates to family or your member-care team.

      A few ways {business_name} could use us: • Add a wellness-check ministry without adding volunteer hours • Catch isolation, depression, and missed medications early • Give peace of mind to adult children of your members who live out of state

      We work with several SE US churches on a discounted partnership basis. Open to a 15-minute call to explore whether it could be a fit for {business_name}?

      Blessings, Shaun SGiQ Business Strategies | CheckWellCall 1-877-343-1891 | checkwellcall.com
  - key: follow_up
    name: Cold Email — Follow-up
    subject: "Following up — wellness-check ministry for {business_name}"
    body: |
      Hi {contact_name},

      Following up on the note about a daily wellness-check ministry for {business_name}'s homebound members. No pressure either way — happy to send a one-pager you can share with the elders or member care committee if that's easier than a call.

      Blessings, Shaun
  - key: referral_source
    name: Cold Email — Referral Source
    subject: "{city} families looking for senior-care guidance"
    body: |
      Hi {contact_name},

      {personalized_opener}

      We work with families across {city} caring for aging parents, and a meaningful number of them ask us about local faith communities — especially for the spiritual-care side of eldercare that we can't provide ourselves.

      Could {business_name} be on the short list we recommend to {city}, {state} families? Quick intro call to see if there's a fit?

      Blessings, Shaun SGiQ Business Strategies | CheckWellCall