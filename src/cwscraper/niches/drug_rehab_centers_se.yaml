slug: drug_rehab_centers_se
display_name: Drug Rehab & Recovery Centers — Southeast US
mode: directory
description: |
  Addiction treatment, recovery centers, outpatient rehab, and sober living
  facilities across FL/GA/SC/NC/TN. Two specific fits for wellness checks:
    1. Post-discharge support for elderly patients returning home —
       prescription drug recovery (opioids, benzos) is increasingly common
       in seniors and the first 90 days post-discharge are where relapse
       risk + isolation overlap
    2. Caregiver support — adult children whose elderly parents have
       discharged from rehab and need monitoring without being put back
       in institutional care
  Sensitive industry — outreach is professional, clinical-toned, never glib.

directory:
  category_label: rehab_center
  search_queries:
    - drug rehab center
    - addiction treatment center
    - outpatient rehab
    - alcohol treatment center
    - recovery center
  locations:
    - Miami, FL
    - Fort Lauderdale, FL
    - Tampa, FL
    - St. Petersburg, FL
    - Orlando, FL
    - Jacksonville, FL
    - Naples, FL
    - Sarasota, FL
    - Atlanta, GA
    - Savannah, GA
    - Augusta, GA
    - Charleston, SC
    - Columbia, SC
    - Greenville, SC
    - Charlotte, NC
    - Raleigh, NC
    - Greensboro, NC
    - Asheville, NC
    - Nashville, TN
    - Memphis, TN
    - Knoxville, TN
    - Chattanooga, TN
  min_rating: 3.5
  max_per_query: 20

default_outreach_template: post_discharge_support

outreach_templates:
  - key: post_discharge_support
    name: Cold Email — Post-Discharge Support
    subject: "Post-discharge wellness checks for {business_name}'s elderly clients"
    body: |
      Hi {contact_name},

      The first 90 days post-discharge are where many older patients
      relapse — isolation, missed medication routines, the loss of the
      structure they had during treatment. {business_name}'s clinical
      team can't be on the phone with every patient daily, but the
      check-in cadence is what works.

      CheckWellCall provides exactly that: daily wellness check calls
      to elderly clients post-discharge, with documented escalation
      back to {business_name}'s alumni coordinator or the patient's
      family when something seems off — missed calls, behavioral
      changes, signs the support system at home is fraying.

      A few rehab centers in {city} use us as a paid add-on for
      families of elderly patients moving home. Worth a brief call to
      see if it could extend {business_name}'s aftercare program?

      Best,
      Shaun
      SGiQ Business Strategies | CheckWellCall
      1-877-343-1891 | checkwellcall.com

  - key: caregiver_referral
    name: Cold Email — Caregiver-of-Client Support
    subject: "Support for adult children of {business_name}'s elderly clients"
    body: |
      Hi {contact_name},

      Adult children of older patients in recovery often face two
      problems at once: their parent is back home and stable but still
      fragile, and they themselves are running on empty from the
      treatment process.

      CheckWellCall is the daily wellness call that lets the family
      step back without stepping away. We work with several rehab
      programs in {city} to offer this as a soft referral for
      families of discharged elderly clients.

      Would a quick conversation about how this might fit {business_name}'s
      family-support workflow be useful?

      Best,
      Shaun
      SGiQ Business Strategies | CheckWellCall

  - key: follow_up
    name: Cold Email — Follow-up
    subject: "Following up — post-discharge wellness checks"
    body: |
      Hi {contact_name},

      Following up on the note about post-discharge wellness check
      support for {business_name}'s elderly clients. Happy to send a
      brief overview if a call doesn't fit right now.

      Best,
      Shaun
