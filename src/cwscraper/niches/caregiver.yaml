slug: caregiver
display_name: Caregiver & Aging Parents
description: |
  Identifies adult children and family caregivers researching solutions for
  aging parents — wellness checks, remote caregiving, aging in place.
  Ships pre-tuned for CheckWellCall but suitable for any senior-care vendor.

# --- Intent scoring ---
high_intent_keywords:
  - wellness check
  - daily check in
  - daily check-in
  - check on my mom
  - check on my dad
  - check on my parent
  - check on my mother
  - check on my father
  - lives alone
  - living alone
  - long distance caregiv
  - remote caregiv
  - worried about my mom
  - worried about my dad
  - worried about my parent
  - falls at home
  - fall detection
  - aging in place
  - daily phone call
  - call every day
  - someone to call
  - who can check

medium_intent_keywords:
  - aging parent
  - elderly parent
  - caregiver burnout
  - caregiver stress
  - sandwich generation
  - parent with dementia
  - assisted living alternative
  - nursing home alternative
  - home safety elderly
  - parent refuses help
  - stubborn parent
  - independent senior
  - aging mother
  - aging father
  - elderly mom
  - elderly dad

